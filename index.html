<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rui Rodrigues — CV 3D</title>
  <meta name="description" content="Rui Rodrigues — Developer & DevOps, exploring Data & AI. Interactive 3D CV." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- HUD: name (appears after the intro) -->
  <div id="hudName" class="hud-name hidden-soft">Rui Rodrigues<span> · CV</span></div>

  <!-- Language toggle -->
  <div id="langToggle" class="lang-toggle" role="group" aria-label="Language">
    <button id="langPt" data-lang="pt" type="button">PT</button>
    <button id="langEn" data-lang="en" type="button">EN</button>
    <button id="langEs" data-lang="es" type="button">ES</button>
  </div>

  <!-- Intro overlay -->
  <div id="intro" class="intro">
    <div class="intro-inner">
      <p class="intro-hello">Rui Rodrigues</p>
      <h1 id="introSubtitle" class="intro-subtitle"></h1>
      <p id="introAbout" class="intro-about"></p>
      <div class="intro-links">
        <a id="introEmail" href="#" rel="noopener">✉ rui.ped.rodrigues@gmail.com</a>
        <a id="introLinkedin" href="#" target="_blank" rel="noopener">in/ruiirodrigues</a>
      </div>
      <div class="scroll-cue">
        <div class="mouse"><div class="wheel"></div></div>
        <p id="scrollHint"></p>
        <p id="keysHint" class="keys-hint"></p>
      </div>
    </div>
  </div>

  <!-- Milestone card -->
  <aside id="card" class="card hidden" aria-live="polite">
    <div class="card-scroll">
      <div class="card-head">
        <span id="cardYear" class="chip year-chip"></span>
        <span id="cardBadge" class="chip badge-chip hidden"></span>
        <span id="cardCurrent" class="chip current-chip hidden"></span>
      </div>
      <h2 id="cardTitle"></h2>
      <p id="cardMeta" class="card-meta"></p>
      <ul id="cardBullets" class="card-bullets"></ul>
      <div id="cardGroups" class="card-groups"></div>
      <div id="cardTech" class="card-tech hidden">
        <h4 id="cardTechLabel"></h4>
        <div id="cardTechChips" class="chips"></div>
      </div>
      <div id="cardContact" class="card-contact hidden">
        <p id="contactText"></p>
        <a id="btnEmail" class="btn" href="#">✉ <span></span></a>
        <a id="btnPhone" class="btn" href="#">☎ <span></span></a>
        <a id="btnLinkedin" class="btn" href="#" target="_blank" rel="noopener">in <span></span></a>
        <button id="btnRestart" class="btn ghost" type="button"><span></span></button>
      </div>
    </div>
  </aside>

  <!-- Progress / minimap -->
  <nav id="progress" class="progress" aria-label="Timeline">
    <div class="progress-line"><div id="progressFill" class="progress-fill"></div></div>
    <div id="progressDots" class="progress-dots"></div>
  </nav>

  <!-- Static fallback (no WebGL) -->
  <div id="fallback" class="fallback hidden"></div>

  <script src="js/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
